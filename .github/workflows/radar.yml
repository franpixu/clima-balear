name: Radar
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - run: python radar.py
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
      - run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add radar
          git commit -m "Radar" || echo "sin cambios"
          git push
