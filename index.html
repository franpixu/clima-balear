<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clima Balear Extremo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{height:100%;margin:0;font-family:sans-serif}
header{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 12px;background:#0b1e33;color:#fff;box-sizing:border-box}
header span{font-size:12px;opacity:.85;text-align:right}
#mapa{height:calc(100% - 56px)}
.caja{background:rgba(255,255,255,.94);padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.5;box-shadow:0 1px 5px rgba(0,0,0,.35);max-width:210px}
.pto{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle}
.nota{margin-top:6px;padding-top:6px;border-top:1px solid #ccc;font-size:11px;line-height:1.35;color:#333}
</style>
</head>
<body>
<header><strong>Clima Balear Extremo</strong><span id="estado">Cargando radar…</span></header>
<div id="mapa"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Centro del radar de Baleares, ya ajustado con las costas, y alcance de 240 km
var LAT0 = 39.352, LON0 = 2.7884, RADIO_KM = 240;

var mapa = L.map('mapa').setView([39.6, 2.9], 8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 18, attribution: '© OpenStreetMap'}).addTo(mapa);
mapa.attributionControl.addAttribution('Radar © AEMET · Rain Viewer');

function limites() {
  var dLat = RADIO_KM / 111.32;
  var dLon = RADIO_KM / (111.32 * Math.cos(LAT0 * Math.PI / 180));
  return [[LAT0 - dLat, LON0 - dLon], [LAT0 + dLat, LON0 + dLon]];
}

var radar = L.imageOverlay('radar/radar.png', limites(), {opacity: 0.9});
var rainviewer = L.layerGroup();

radar.addTo(mapa);
L.control.layers(null, {
  'Radar ClimaExtremoSpain': radar,
  'Radar Europa (Rain Viewer)': rainviewer
}, {collapsed: false}).addTo(mapa);

function hora(s) {
  return new Date(s).toLocaleTimeString('es-ES', {hour: '2-digit', minute: '2-digit'});
}

function recargar() {
  var t = Date.now();
  radar.setUrl('radar/radar.png?t=' + t);
  fetch('radar/meta.json?t=' + t).then(function (r) { return r.json(); }).then(function (m) {
    var txt = m.imagen
      ? 'Datos AEMET de las ' + hora(m.imagen)
      : 'Datos AEMET · descargados a las ' + hora(m.actualizado);
    document.getElementById('estado').textContent = 'Radar ClimaExtremoSpain · ' + txt;
  }).catch(function () {
    document.getElementById('estado').textContent = 'Radar no disponible';
  });
}

// Rain Viewer (opcional, para comparar)
fetch('https://api.rainviewer.com/public/weather-maps.json').then(function (r) { return r.json(); }).then(function (d) {
  var f = d.radar.past[d.radar.past.length - 1];
  L.tileLayer(d.host + f.path + '/256/{z}/{x}/{y}/2/1_1.png', {opacity: 0.6, maxNativeZoom: 7, maxZoom: 18}).addTo(rainviewer);
}).catch(function () {});

// Leyenda
var leyenda = L.control({position: 'bottomleft'});
leyenda.onAdd = function () {
  var d = L.DomUtil.create('div', 'caja');
  d.innerHTML = '<b>Lluvia (reflectividad)</b><br>' +
    '<span class="pto" style="background:#00c800"></span>Débil · 12-30 dBZ<br>' +
    '<span class="pto" style="background:#ffe600"></span>Moderada · 30-42 dBZ<br>' +
    '<span class="pto" style="background:#ff0000"></span>Fuerte · 42-54 dBZ<br>' +
    '<span class="pto" style="background:#9600dc"></span>Severa · 54 dBZ o más' +
    '<div class="nota">Fuente: AEMET. Servicio no oficial: no sustituye los avisos oficiales. En emergencia, 112.</div>';
  return d;
};
leyenda.addTo(mapa);

recargar();
setInterval(recargar, 300000);
</script>
</body>
</html>
